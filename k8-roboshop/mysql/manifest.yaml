apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: roboshop
  labels:
    component: mysql
    project: roboshop
    tier: db

spec:
  replicas: 1
  selector:
    matchLabels:
      component: mysql
      project: roboshop
      tier: db
  template:
    metadata:
      labels:  
        component: mysql
        project: roboshop
        tier: db
    spec:    
      containers: 
      - name: mysql
        image: prudhvimv/mysql:v1
        readinessProbe:
          tcpSocket:
            port: 3306
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 3306
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: roboshop
spec:
  selector:
      component: mysql
      project: roboshop
      tier: db
  ports:
    - protocol: TCP
      port: 3306 # service port
      targetPort: 3306 #container port