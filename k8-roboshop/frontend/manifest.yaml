apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: roboshop
data:
  CART_HOST: "cart"
  CART_PORT: "8080"
  USER_HOST: "user"
  USER_PORT: "8080"
  AMQP_HOST: "rabbitmq"
  AMQP_USER: "roboshop"
  AMQP_PASS: "roboshop123"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: roboshop
spec:
  type: LoadBalancer
  labels:
    component: frontend
    project: roboshop
    tier: frontend

spec:
  replicas: 1
  selector:
    matchLabels:
      component: frontend
      project: roboshop
      tier: frontend
  template:
    metadata:
      labels:  
        component: frontend
        project: roboshop
        tier: frontend
    spec:    
      containers: 
      - name: frontend
        image: prudhvimv/frontend:v1
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: frontend-config
        ports:
        - name: liveness-port
          containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: liveness-port
          failureThreshold: 1
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: liveness-port
          failureThreshold: 1
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: roboshop
spec:
  selector:
      component: frontend
      project: roboshop
      tier: frontend
  ports:
    - protocol: TCP
      port: 80 # service port
      targetPort: 80 #container port