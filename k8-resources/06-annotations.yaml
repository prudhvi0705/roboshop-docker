apiVersion: v1
kind: Pod
metadata:
  name: annotations-demo
  namespace: roboshop
  annotations:
    name: annotationsdemopod
    url: https://pro.dev.com/build/jenkins/5/ko

spec:
  containers:
   - name: nginx
     image: nginx
     resources:
        requests:
          cpu: "50m"
          mem: "68mi"
        limits:
          cpu: "100m"
          mem: "136mi"
        env:
          course: devops
          module: kubernetes
          trainer: siva