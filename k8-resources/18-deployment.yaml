apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    name: dp-demo
    project: roboshop

spec:
  replicas: 4
  selector:
    matchLabels:
        name: dp-demo
        project: roboshop
  template:
    metadata:
      labels:  
        name: dp-demo
        project: roboshop
    spec:
      containers: 
      - name: nginx
        image: nginx:trixie-perl

        