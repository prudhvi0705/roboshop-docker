apiVersion: v1
kind: PersistentVolume
metadata:
  name: test-pv
spec:
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  capacity:
    storage: 15Gi
  csi:
    driver: ebs.csi.aws.com
    fsType: ext4
    volumeHandle: vol-03668e2200de2ce26
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: test-pv
spec:
  storageClassName: "" # Empty string must be explicitly set otherwise default StorageClass will be set
  volumeName: test-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 15Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx
labels:
  project: roboshop
spec:
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - name: test-pv
      mountPath: /usr/share/nginx/html
  nodeSelector:
    topology.kubernetes.io/zone: us-east-1d
    accelerator:
  volumes:
  - name: test-pv
    persistentVolumeClaim:
      claimName: test-pv
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-ebs-svc
spec:
  type: LoadBalancer
  selector:
    project: roboshop
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30007